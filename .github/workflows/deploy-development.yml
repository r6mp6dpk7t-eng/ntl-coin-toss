
name: Deploy Development Site

on:
  push:
    branches:
      - development-16-nov-26
    paths:
      - 'index.html'
      - 'data/**'
      - '.github/workflows/deploy-development.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: development-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare development site
        run: |
          mkdir -p public/dev
          cp index.html public/dev/
          cp -r data public/dev/

      - name: Upload development site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy development site
        id: deployment
        uses: actions/deploy-pages@v4
