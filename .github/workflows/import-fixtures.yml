
name: Import NTL Fixtures

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Import NTL fixtures
        run: python scripts/import_fixtures.py

      - name: Save fixture data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json
          git diff --cached --quiet || git commit -m "Update NTL fixture data"
          git push
